# ================================
# SERVER CONFIG
# ================================
server:
  port: ${PORT:8080}

# ================================
# SPRING CONFIG
# ================================
spring:
  application:
    name: AUTH-SERVICE

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      pool-name: AuthHikariCP
      connection-timeout: 10000
      initialization-fail-timeout: 0

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        boot.allow_jdbc_metadata_access: false
        jdbc.fetch_size: 100
        transaction.jta.platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# ================================
# LOGGING
# ================================
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level) %clr([%thread]){magenta} %clr(%logger{36}){cyan} : %msg%n%wEx{1}"

  level:
    root: INFO
    org.hibernate.orm.connections.pooling: ERROR

# ================================
# ACTUATOR + PROMETHEUS
# ================================
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics

  endpoint:
    health:
      show-details: always

# ================================
# JWT CONFIG
# ================================
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  issuer: vikas-app

# ================================
# EUREKA CONFIG
# ================================
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: https://eureca-server.onrender.com/eureka

  instance:
    prefer-ip-address: true