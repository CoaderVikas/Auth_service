# ================================
# SERVER CONFIG
# ================================
server:
  port: 9091

error:
  include-stacktrace: never
  include-message: always

# ================================
# SPRING CONFIG
# ================================
spring:
  profiles:
    active: local

  application:
    name: AUTH-SERVICE

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      pool-name: AuthHikariCP
      connection-timeout: 10000
      initialization-fail-timeout: 0

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        boot.allow_jdbc_metadata_access: false
        default_schema: SYSTEM
        jdbc.fetch_size: 100
        transaction.jta.platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

    redis:   
      host: localhost
      port: 6379

  kafka:   
    bootstrap-servers: ${kafka_bootstrap_servers}
    username: ${kafka_username}
    password: ${KAFKA_PASSWORD}
    properties:
      security.protocol: SASL_SSL
      sasl:
        mechanism: SCRAM-SHA-256
        jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="${kafka_username}" password="${KAFKA_PASSWORD}";'
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  config:
    import:
      - optional:configserver:http://localhost:8452

# ================================
# LOGGING
# ================================
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level) [%X{requestId}] [trace_id=%X{trace_id}] [%X{clientIp}] %clr([%thread]){magenta} %clr(%logger{36}){cyan} : %msg%n%wEx{5}"
  level:
    root: INFO
    org.hibernate.orm.connections.pooling: ERROR

# ================================
# ACTUATOR + PROMETHEUS
# ================================
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics

  endpoint:
    health:
      show-details: always

    prometheus:   
      access: unrestricted

  metrics:
    tags:
      application: auth-service

# ================================
# JWT CONFIG
# ================================
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  issuer: vikas-app

#eureka:
#  client:
#    register-with-eureka: true
#    fetch-registry: true
#    service-url:
#      defaultZone: http://eureka-server:8761/eureka/

google:
  client:
    id: ${GOOGLE_CLIENT_ID}

firebase:
  project-id: ${FB_PROJECT_ID}
  client-email: ${FB_CLIENT_EMAIL}
  private-key: ${FB_PRIVATE_KEY}