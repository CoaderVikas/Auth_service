# ==========================================
# 1. EUREKA SERVER: DEPLOYMENT & SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: eureka-server:latest  
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-service 
spec:
  type: NodePort
  selector:
    app: eureka-server
  ports:
    - protocol: TCP
      port: 8761
      targetPort: 8761
      nodePort: 30761
#  type: ClusterIP

---
# ==========================================
# 2. AUTH SERVICE: DEPLOYMENT
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:1.0
          ports:
            - containerPort: 9091
          env:
            # Profile
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"

            # Database Configs
            - name: DATASOURCE_URL
              value: "jdbc:postgresql://host.docker.internal:5432/RentHubDB"
            - name: DATASOURCE_USERNAME
              value: "postgres"
            - name: DATASOURCE_PASSWORD
              value: "123456"
            - name: DATASOURCE_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"

            # Redis Connection
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-service"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

            # JWT
            - name: JWT_SECRET
              value: "ieeuNqK1zLIJiPgKv8rnw0nxQcn/xVcYobLOtPkM23E="

            # 🟢 FIXED: URL corrected to match the Service Name above
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-service:8761/eureka/"

            # Config Server bypass/fix for K8s environment 
            - name: SPRING_CLOUD_CONFIG_ENABLED
              value: "false"

---
# ==========================================
# 3. REDIS: DEPLOYMENT
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379

---
# ==========================================
# 4. REDIS: SERVICE
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP